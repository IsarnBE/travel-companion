<article class="folder folder-map operations-folder">
  <button class="folder-tab" type="button">
    <span class="folder-icon">🧭</span>

    <span class="folder-title">
      <strong>Centro de Operaciones</strong>
      <small>Todo lo que tienes cerca</small>
    </span>

    <span class="folder-arrow">⌄</span>
  </button>

  <div class="folder-content operations-content">
    <div class="operations-heading">
      <p class="map-label">Centro de Operaciones</p>
      <h3>¿Qué estás buscando?</h3>
      <p>Selecciona una categoría para consultar sus lugares.</p>
    </div>

    <div class="operations-categories">

  <div class="operations-row">
    <div class="operations-row-buttons">
      <button class="operation-category active" data-category="all" type="button">
        <span>🌍</span>
        <strong>Todo</strong>
      </button>

      <button class="operation-category" data-category="principal" type="button">
        <span>📍</span>
        <strong>Principal</strong>
      </button>
    </div>
  </div>

  <div class="operations-row">
    <div class="operations-row-buttons">
      <button class="operation-category" data-category="services" type="button">
        <span>🚑</span>
        <strong>Servicios</strong>
      </button>

      <button class="operation-category" data-category="places" type="button">
        <span>🏰</span>
        <strong>Lugares de interés</strong>
      </button>
    </div>
  </div>

  <div class="operations-row">
    <div class="operations-row-buttons">
      <button class="operation-category" data-category="beaches" type="button">
        <span>🏖️</span>
        <strong>Playas</strong>
      </button>

      <button class="operation-category" data-category="restaurants" type="button">
        <span>🍽️</span>
        <strong>Restaurantes</strong>
      </button>
    </div>
  </div>

  <div class="operations-row">
    <div class="operations-row-buttons">
      <button class="operation-category" data-category="icecreams" type="button">
        <span>🍦</span>
        <strong>Heladerías</strong>
      </button>

      <button class="operation-category" data-category="bars" type="button">
        <span>🍹</span>
        <strong>Bares y Beach Clubs</strong>
      </button>
    </div>
  </div>

</div>

<section id="operations-results" class="operations-results">
  <div class="operations-results-heading">
    <h4 id="operations-title">Todo</h4>
    <small id="operations-count">0 lugares</small>
  </div>

  <div id="operations-list" class="operations-list">
    <p class="operations-empty">
      Selecciona una categoría.
    </p>
  </div>
</section>

    <a
      class="map-open-button"
      href="https://www.google.com/maps/d/viewer?mid=1As36r0sPnsPbciLy-aY8WuUIRZUlILk"
      target="_blank"
      rel="noopener noreferrer">
      🗺️ Abrir mapa general
    </a>
  </div>
</article>
